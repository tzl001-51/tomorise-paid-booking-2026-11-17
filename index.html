  <script type="module">const WEEK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; const DAYS = [1, 2, 3, 4, 5, 6, 0]; const DURATION = 45; const PREPARATION_DAYS = 2; const BOOKABLE_DAYS = 7; const MAX_LESSONS = 3; const TEACHERS = [   { id: 'v', name: 'Veronica', initials: 'VE', detail: 'Builds confidence, step by step', slots: ['1-16', '1-17', '3-16', '3-17', '5-17', '6-10'] },   { id: 'a', name: 'Alex', initials: 'AL', detail: 'Makes tricky concepts feel simple', slots: ['1-16', '2-16', '4-17', '4-18', '6-10', '6-11'] },   { id: 'm', name: 'Maya', initials: 'MA', detail: 'Connects math to everyday life', slots: ['2-17', '2-18', '4-17', '5-16', '0-10', '0-11'] },   { id: 'j', name: 'Jordan', initials: 'JO', detail: 'Patient support for curious minds', slots: ['3-18', '3-19', '5-18', '5-19', '6-11', '0-10'] },   { id: 's', name: 'Sophie', initials: 'SO', detail: 'Helps independent thinkers grow', slots: ['1-18', '2-17', '4-18', '5-17', '0-11', '0-12'] }, ]; const GOALS = [   'Fill gaps in math basics', 'Understand concepts, not just memorize',   'Complete homework independently', 'Prepare for school tests or the next grade',   'Improve grades and test results', 'Build confidence and enjoy math', ];  function initialState(frequency = 2, today = isoDate(new Date())) {   const startDate = addDays(today, PREPARATION_DAYS);   return { step: 0, frequency, sameTeacher: true, slots: [], day: localDate(startDate).getDay(),     today, paidDate: today, reschedules: {}, startDate, activeDate: startDate,     goals: [], note: '', consent: false, status: 'booking', past: false, expanded: false }; }  function candidates(slots) {   return TEACHERS.filter(teacher => slots.every(slot => teacher.slots.includes(slot))); }  function eligibleTeachers(state) {   return state.sameTeacher ? candidates(state.slots) : TEACHERS; }  function availableSlots(state) {   return [...new Set(eligibleTeachers(state).flatMap(teacher => teacher.slots))]; }  function orderedSlots(slots) {   return [...slots].sort((a, b) => {     const [ad, ah] = a.split('-').map(Number);     const [bd, bh] = b.split('-').map(Number);     return DAYS.indexOf(ad) - DAYS.indexOf(bd) || ah - bh;   }); }  function timeLabel(hour) {   return `${hour % 12 || 12}:00 ${hour < 12 ? 'AM' : 'PM'}`; }  function slotLabel(slot) {   const [day, hour] = slot.split('-').map(Number);   return `${WEEK[day]} · ${timeLabel(hour)}`; }  function localDate(value) {   return new Date(`${value}T12:00:00`); }  function isoDate(date) {   const pad = n => String(n).padStart(2, '0');   return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`; }  function addDays(value, days) {   const date = localDate(value);   date.setDate(date.getDate() + days);   return isoDate(date); }  function bookingDates(state) {   return Array.from({ length: PREPARATION_DAYS + BOOKABLE_DAYS }, (_, offset) => {     const date = addDays(state.today, offset);     return { date, day: localDate(date).getDay(), bookable: offset >= PREPARATION_DAYS, offset };   }); }  function dateLabel(value, options = {}) {   return localDate(value).toLocaleDateString('en-US', { month: 'short', day: 'numeric', ...options }); }  function firstOccurrence(slot, startDate) {   const day = Number(slot.split('-')[0]);   const date = localDate(startDate);   date.setDate(date.getDate() + (day - date.getDay() + 7) % 7);   return isoDate(date); }  function validSchedule(state) {   return state.slots.length === state.frequency && (!state.sameTeacher || candidates(state.slots).length > 0); }  function lessons(state) {   const fixedTeacher = candidates(state.slots)[0];   const rows = state.slots.flatMap(slot => [0, 7].map(offset => {     const date = localDate(firstOccurrence(slot, state.startDate));     date.setDate(date.getDate() + offset);     const teacher = state.sameTeacher ? fixedTeacher : candidates([slot])[0];     return { id: `${slot}-${offset}`, slot, date: isoDate(date), hour: Number(slot.split('-')[1]), teacher };   }));   row oastTimer);   toastTimer = setTimeout(() => { target.hidden = true; }, 4500); }  function next() {   if (state.step === 0 && !validSchedule(state)) return;   if (state.step >= 1 && (!state.goals.length || !state.consent)) return;   if (state.step === 2 && !validSchedule(state)) return;   if (state.step === 2) { state.status = 'scheduled'; state.past = false; state.expanded = false; state.reschedules = {}; }   else state.step += 1;   render(true); }  function chooseSlot(slot) {   if (state.slots.includes(slot)) state.slots = state.slots.filter(value => value !== slot);   else {     if (state.slots.length >= state.frequency || !availableSlots(state).includes(slot)) return;     state.slots.push(slot);   }   render();   document.querySelector('#announcement').textContent = scheduleMessage(state); }  function runAction(action) {   const actions = {     next, back: () => { state.step = Math.max(0, state.step - 1); render(true); },     'remove-last': () => { state.slots.pop(); render(); },     'allow-different': () => { state.sameTeacher = false; render(); },     upcoming: () => { state.past = false; render(); },     past: () => { state.past = true; render(); },     'expand-lessons': () => { state.expanded = !state.expanded; render(); },     'change-times': () => { state.status = 'booking'; state.step = 0; render(true); },     'manage-plan': () => toast(`Your Math plan includes ${state.frequency} lessons per week. Billing is not connected in this prototype.`),   };   if (actions[action]) return actions[action]();   if (action.startsWith('edit-')) { state.step = Number(action.slice(-1)); render(true); } }  app.addEventListener('click', event => {   const target = event.target.closest('button');   if (!target || target.disabled) return;   if (target.dataset.reschedule) return reschedule.open(target.dataset.reschedule, target);   if (target.dataset.action) return runAction(target.dataset.action);   if (target.dataset.date) {     const selected = bookingDates(state).find(day => day.date === target.dataset.date && day.bookable);     if (!selected) return;     state.day = selected.day; state.activeDate = selected.date; render();   }   if (target.dataset.slot) chooseSlot(target.dataset.slot);   if (target.dataset.remove) { state.slots = state.slots.filter(slot => slot !== target.dataset.remove); render(); } });  app.addEventListener('change', event => {   const target = event.target;   if (target.id === 'same-teacher') state.sameTeacher = target.checked;   if (target.id === 'recording-consent') state.consent = target.checked;   if (target.name === 'goal') {     const index = Number(target.value);     state.goals = target.checked ? [...state.goals, index] : state.goals.filter(goal => goal !== index);   }   render(); });  app.addEventListener('input', event => {   if (event.target.id === 'learning-note') { state.note = event.target.value; save(); } });  document.querySelector('#demo-frequency').addEventListener('change', event => {   state = initialState(Number(event.target.value));   render(true);   toast(`已切换为每周 ${state.frequency} 节课，预约流程已重置。`); }); document.querySelector('#demo-reset').addEventListener('click', () => { state = initialState(state.frequency); render(true); }); document.querySelector('.brand').addEventListener('click', event => { event.preventDefault(); toast('Your Math plan is right here.'); }); const support = document.querySelector('#support'); document.querySelector('#help').addEventListener('click', () => support.showModal()); for (const id of ['close-support', 'support-done']) document.getElementById(id).addEventListener('click', () => support.close()); mobileLayout.addEventListener('change', arrangeMobileSchedule); render(); </script>
